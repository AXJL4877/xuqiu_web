services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xuqiu
      POSTGRES_PASSWORD: xuqiu
      POSTGRES_DB: xuqiu
    ports:
      - "5432:5432"
    volumes:
      - xuqiu_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xuqiu -d xuqiu"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  xuqiu_pg_data:

# 阿里云 ECS 生产部署：应用 + PostgreSQL + Nginx
# 使用：cp deploy/env.production.example .env.production && 编辑后
#       docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xuqiu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-xuqiu}
    volumes:
      - xuqiu_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-xuqiu} -d ${POSTGRES_DB:-xuqiu}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - xuqiu_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-xuqiu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-xuqiu}?schema=public
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - xuqiu_net

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - xuqiu_net

volumes:
  xuqiu_pg_data:

networks:
  xuqiu_net:
